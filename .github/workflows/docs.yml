name: Documentation

on:
  push:
    branches:
      - main
      - codex/cohesive-edge-library
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCS_OUTPUT: ${{ runner.temp }}/lems-data-docs-site
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y doxygen

      - name: Build documentation
        run: python3 tools/build_docs.py --output "$DOCS_OUTPUT"

      - name: Validate generated documentation
        run: python3 tools/check_docs.py --site "$DOCS_OUTPUT/html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/lems-data-docs-site/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
