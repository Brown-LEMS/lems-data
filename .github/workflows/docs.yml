name: Documentation

on:
  push:
    branches:
      - main
      - jh_dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCS_OUTPUT: /tmp/lems-data-docs-site
      DOXYGEN_VERSION: 1.18.0
      DOXYGEN_SHA256: 14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90
      DOXYGEN: /tmp/doxygen-1.18.0/bin/doxygen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install pinned Doxygen
        run: |
          set -euo pipefail
          archive="/tmp/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --output "$archive" \
            "https://www.doxygen.nl/files/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          echo "${DOXYGEN_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory /tmp
          test -x "$DOXYGEN"

      - name: Verify Doxygen version
        run: |
          set -euo pipefail
          actual="$($DOXYGEN --version)"
          test "$actual" = "$DOXYGEN_VERSION"
          echo "Using Doxygen $actual from $DOXYGEN"

      - name: Build documentation
        run: python3 tools/build_docs.py --doxygen "$DOXYGEN" --output "$DOCS_OUTPUT"

      - name: Validate generated documentation
        run: python3 tools/check_docs.py --site "$DOCS_OUTPUT/html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/lems-data-docs-site/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
